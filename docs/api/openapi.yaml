  /projects/{id}/agents/{agent_id}/chat:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: agentChat
      tags: [Agent]
      summary: Chat with agent (SSE streaming)
      description: |
        Sends a message to the agent. Response is streamed via Server-Sent Events (SSE).
        Each SSE event has format: `data: {json}\n\n`

        Event types:
        - `{"type": "token", "content": "..."}` — streaming text token
        - `{"type": "tool_call", "name": "...", "args": {...}}` — tool invocation
        - `{"type": "tool_result", "name": "...", "result": {...}}` — tool result
        - `{"type": "done", "message_id": "..."}` — stream complete
        - `{"type": "error", "message": "..."}` — error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE event stream

