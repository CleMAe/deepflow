                        $ref: '#/components/schemas/PromptTemplate'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project UUID
    DatasetId:
      name: ds_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Dataset UUID
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 10-01-001
            message: "Invalid request parameters"
            data: null
            request_id: "a1b2c3d4"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: "10-03-001"
            message: "Invalid or expired token"
            data: null
            request_id: "a1b2c3d4"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: "20-02-001"
            message: "Resource not found"
            data: null
            request_id: "a1b2c3d4"
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: "10-03-002"
            message: "Permission denied"
            data: null
            request_id: "a1b2c3d4"

  schemas:
    # ─── Common ────────────────────────────────────────────
    ApiResponse:
      type: object
      required: [code, message, data, request_id]
      properties:
        code:
          type: integer
          description: "0 = success, 8-digit error code on failure (XX-YY-ZZZ)"
        message:
          type: string
        data:
          nullable: true
        request_id:
          type: string
          format: uuid

    Pagination:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    # ─── Auth ──────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          format: password
          minLength: 6
        role:
          type: string
          enum: [admin, developer, viewer]
          default: developer

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          default: bearer
        expires_in:
          type: integer
          description: Seconds until access token expiry

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [admin, developer, viewer]
        created_at:
          type: string
          format: date-time

    # ─── Project ───────────────────────────────────────────
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        storage_quota:
          type: integer
          description: Storage quota in MB

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 1024
        storage_quota:
          type: integer

    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        owner_id:
          type: string
          format: uuid
        storage_quota:
          type: integer
        storage_used:
          type: integer
          description: Used storage in MB
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PaginatedProjects:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Project'

    # ─── Dataset ───────────────────────────────────────────
    UploadInitRequest:
      type: object
      required: [filename, total_size, total_chunks]
      properties:
        filename:
          type: string
        total_size:
          type: integer
          description: File size in bytes
        total_chunks:
          type: integer
        dataset_name:
          type: string
        format:
          type: string
          enum: [csv, json, image, other]
          description: Data format hint

    UploadSession:
      type: object
      properties:
        upload_id:
          type: string
          format: uuid
        chunk_size:
          type: integer
          description: Recommended chunk size in bytes
        received_chunks:
          type: array
          items:
            type: integer

    DatasetCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        format:
          type: string
          enum: [csv, json, image, other]
        description:
          type: string
        tags:
          type: array
          items:
            type: string

    DatasetUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string

    Dataset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        format:
          type: string
          enum: [csv, json, image, other]
        file_path:
          type: string
        num_samples:
          type: integer
        num_columns:
          type: integer
        columns_meta:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMeta'
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [uploading, ready, cleaning, cleaned, error]
        size_bytes:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ColumnMeta:
      type: object
      properties:
        name:
          type: string
        dtype:
          type: string
        nullable:
          type: boolean
        unique_count:
          type: integer
        sample_values:
          type: array
          items: {}

    DatasetPreview:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        total_rows:
          type: integer

    ImageItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        thumbnail_path:
          type: string
        labels:
          type: array
          items:
            type: string
        width:
          type: integer
        height:
          type: integer

    BatchLabelUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [image_id, labels]
            properties:
              image_id:
                type: string
                format: uuid
              labels:
                type: array
                items:
                  type: string

    PaginatedDatasets:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Dataset'

    PaginatedImages:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ImageItem'

    # ─── Cleaning ──────────────────────────────────────────
    CleanMissingRequest:
      type: object
      required: [strategy]
      properties:
        columns:
          type: array
          items:
            type: string
          description: Target columns (empty = all columns with missing values)
        strategy:
          type: string
          enum: [drop_row, fill_mean, fill_median, fill_mode, fill_constant, forward_fill, backward_fill]
        fill_value:
          description: Value for fill_constant strategy
        create_new_version:
          type: boolean
          default: true

    CleanOutlierRequest:
      type: object
      required: [columns, method]
      properties:
        columns:
          type: array
          items:
            type: string
        method:
          type: string
          enum: [zscore, iqr, isolation_forest]
        threshold:
          type: number
          description: Z-score threshold (default 3.0) or IQR multiplier (default 1.5)
        action:
          type: string
          enum: [drop, clip, mark]
          default: drop

    CleanDedupRequest:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
          description: Columns to check for duplicates (empty = all columns)
        keep:
          type: string
          enum: [first, last, none]
          default: first

    CleanEncodeRequest:
      type: object
      required: [columns, method]
      properties:
        columns:
          type: array
          items:
            type: string
        method:
          type: string
          enum: [label_encoding, one_hot, target_encoding, frequency_encoding]

    CleanTypeConvertRequest:
      type: object
      required: [conversions]
      properties:
        conversions:
          type: array
          items:
            type: object
            required: [column, target_type]
            properties:
              column:
                type: string
              target_type:
                type: string
                enum: [int, float, str, bool, datetime]
              datetime_format:
                type: string
                description: Format string for datetime conversion

    CleaningResult:
      type: object
      properties:
        rows_before:
          type: integer
        rows_after:
          type: integer
        columns_affected:
          type: array
          items:
            type: string
        changes_summary:
          type: object
          additionalProperties: true
        dataset_id:
          type: string
          format: uuid

    # ─── EDA ───────────────────────────────────────────────
    EDARequest:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
          description: Columns to analyze (empty = all)
        include_visualizations:
          type: boolean
          default: true

    EDAReport:
      type: object
      properties:
        dataset_id:
          type: string
          format: uuid
        summary:
          type: object
          properties:
            num_rows:
              type: integer
            num_columns:
              type: integer
            num_missing:
              type: integer
            duplicate_rows:
              type: integer
        column_stats:
          type: array
          items:
            $ref: '#/components/schemas/ColumnStat'
        correlations:
          type: object
          description: Correlation matrix for numeric columns
          additionalProperties:
            type: object
            additionalProperties:
              type: number
        visualizations:
          type: array
          items:
            $ref: '#/components/schemas/Visualization'
        created_at:
          type: string
          format: date-time

    ColumnStat:
      type: object
      properties:
        name:
          type: string
        dtype:
          type: string
        missing_count:
          type: integer
        missing_pct:
          type: number
        unique_count:
          type: integer
        mean:
          type: number
        std:
          type: number
        min:
          type: number
        q25:
          type: number
        median:
          type: number
        q75:
          type: number
        max:
          type: number
        top_values:
          type: array
          items:
            type: object
            properties:
              value: {}
              count:
                type: integer

    Visualization:
      type: object
      properties:
        type:
          type: string
          enum: [histogram, boxplot, scatter, heatmap, bar, pie]
        title:
          type: string
        config:
          type: object
          additionalProperties: true
          description: ECharts-compatible chart config

    # ─── Augmentation ──────────────────────────────────────
    AugmentRequest:
      type: object
      required: [transforms]
      properties:
        transforms:
          type: array
          items:
            $ref: '#/components/schemas/AugmentTransform'
        num_augmented:
          type: integer
          default: 1
          description: Number of augmented copies per original image
        output_dataset_name:
          type: string

    AugmentTransform:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [rotate, flip_horizontal, flip_vertical, color_jitter, random_crop, mixup, cutmix, gaussian_blur]
        params:
          type: object
          additionalProperties: true
          description: "Transform-specific parameters (e.g. {\"angle\": 15}, {\"brightness\": 0.2})"

    AugmentResult:
      type: object
      properties:
        original_count:
          type: integer
        augmented_count:
          type: integer
        new_dataset_id:
          type: string
          format: uuid
        output_dataset_name:
          type: string

    # ─── Split ─────────────────────────────────────────────
    SplitRequest:
      type: object
      required: [ratios]
      properties:
        ratios:
          type: object
          required: [train]
          properties:
            train:
              type: number
              minimum: 0.01
              maximum: 0.99
            val:
              type: number
              minimum: 0
            test:
              type: number
              minimum: 0
          description: Ratios must sum to 1.0
        stratify_column:
          type: string
          description: Column for stratified splitting
        random_seed:
          type: integer
          default: 42

    SplitResult:
      type: object
      properties:
        train_dataset_id:
          type: string
          format: uuid
        val_dataset_id:
          type: string
          format: uuid
          nullable: true
        test_dataset_id:
          type: string
          format: uuid
          nullable: true
        train_count:
          type: integer
        val_count:
          type: integer
        test_count:
          type: integer

    # ─── Model Library ─────────────────────────────────────
    LibraryModel:
      type: object
      properties:
        model_id:
          type: string
        name:
          type: string
        arch_type:
          type: string
          enum: [resnet18, resnet34, resnet50, efficientnet_b0, efficientnet_b1, mlp, custom]
        task_type:
          type: string
          enum: [classification, regression, object_detection, segmentation]
        description:
          type: string
        input_shape:
          type: array
          items:
            type: integer
        num_params:
          type: integer
        default_hyperparams:
          type: object
          additionalProperties: true
        supported_datasets:
          type: array
          items:
            type: string
            enum: [csv, json, image]
        pretrained_available:
          type: boolean

    # ─── Model Config ──────────────────────────────────────
    ModelCreate:
      type: object
      required: [name, arch_type]
      properties:
        name:
          type: string
        arch_type:
          type: string
          enum: [resnet18, resnet34, resnet50, efficientnet_b0, efficientnet_b1, mlp, custom]
        params_cfg:
          type: object
          additionalProperties: true
          description: Architecture-specific configuration (layers, hidden_dims, etc.)
        description:
          type: string

    ModelUpdate:
      type: object
      properties:
        name:
          type: string
        params_cfg:
          type: object
          additionalProperties: true
        description:
          type: string

    Model:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        arch_type:
          type: string
        params_cfg:
          type: object
          additionalProperties: true
        pretrained:
          type: boolean
        pretrained_source:
          type: string
        model_path:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ModelValidateRequest:
      type: object
      properties:
        params_cfg:
          type: object
          additionalProperties: true

    ValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        warnings:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    PaginatedModels:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Model'

    # ─── Training ──────────────────────────────────────────
    TrainingStatus:
      type: string
      enum: [pending, running, paused, success, failed, cancelled]

    TrainingJobCreate:
      type: object
      required: [name, model_id, dataset_id]
      properties:
        name:
          type: string
        model_id:
          type: string
          format: uuid
        dataset_id:
          type: string
          format: uuid
        val_dataset_id:
          type: string
          format: uuid
        hyperparams:
          type: object
          additionalProperties: true
          description: Training hyperparameters
          properties:
            epochs:
              type: integer
              default: 10
            batch_size:
              type: integer
              default: 32
            learning_rate:
              type: number
              default: 0.001
            optimizer:
              type: string
              enum: [sgd, adam, adamw, rmsprop]
              default: adam
            loss_function:
              type: string
              enum: [cross_entropy, mse, bce, bce_with_logits, nll, l1, huber]
              default: cross_entropy
            weight_decay:
              type: number
              default: 0.0
            momentum:
              type: number
            lr_scheduler:
              type: string
              enum: [none, step, cosine, exponential, reduce_on_plateau]
              default: none
            lr_scheduler_params:
              type: object
              additionalProperties: true
            grad_accum_steps:
              type: integer
              default: 1
            mixed_precision:
              type: boolean
              default: false
            early_stopping:
              type: object
              properties:
                patience:
                  type: integer
                  default: 5
                metric:
                  type: string
                  default: val_loss
                mode:
                  type: string
                  enum: [min, max]
                  default: min
                min_delta:
                  type: number
                  default: 0.0
            checkpoint_every_n_epochs:
              type: integer
              default: 1
            max_grad_norm:
              type: number
        device:
          type: string
          enum: [cpu, cuda, auto]
          default: auto
        description:
          type: string

    TrainingJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        model_id:
          type: string
          format: uuid
        dataset_id:
          type: string
          format: uuid
        val_dataset_id:
          type: string
          format: uuid
        hyperparams:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/TrainingStatus'
        device:
          type: string
        current_epoch:
          type: integer
        total_epochs:
          type: integer
        metrics:
          type: object
          properties:
            train_loss:
              type: number
            val_loss:
              type: number
            accuracy:
              type: number
            best_val_loss:
              type: number
            best_accuracy:
              type: number
        checkpoint:
          type: string
          description: Path to best checkpoint
        error_message:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Checkpoint:
      type: object
      properties:
        epoch:
          type: integer
        step:
          type: integer
        path:
          type: string
        is_best:
          type: boolean
        metrics:
          type: object
          additionalProperties:
            type: number
        file_size:
          type: integer
          description: Size in bytes
        created_at:
          type: string
          format: date-time

    PaginatedTrainingJobs:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TrainingJob'

    # ─── Experiments ───────────────────────────────────────
    Experiment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        name:
          type: string
        metrics:
          type: object
          additionalProperties: true
        params_snap:
          type: object
          additionalProperties: true
          description: Snapshot of hyperparameters used
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time

    ExperimentUpdate:
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        notes:
          type: string

    ExperimentComparison:
      type: object
      properties:
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/Experiment'
        metric_comparison:
          type: object
          additionalProperties:
            type: array
            items:
              type: number
          description: Metric values across experiments
        param_diff:
          type: object
          additionalProperties: true
          description: Parameters that differ between experiments

    PaginatedExperiments:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Experiment'

    # ─── Inference ─────────────────────────────────────────
    EvaluateRequest:
      type: object
      required: [model_id, dataset_id]
      properties:
        model_id:
          type: string
          format: uuid
        dataset_id:
          type: string
          format: uuid
        checkpoint_path:
          type: string
        metrics:
          type: array
          items:
            type: string
          default: [accuracy, f1, precision, recall]
          description: Metrics to compute

    EvaluateResult:
      type: object
      properties:
        model_id:
          type: string
          format: uuid
        dataset_id:
          type: string
          format: uuid
        metrics:
          type: object
          additionalProperties:
            type: number
        confusion_matrix:
          type: array
          items:
            type: array
            items:
              type: integer
        classification_report:
          type: object
          additionalProperties: true
        num_samples:
          type: integer

    BatchInferenceRequest:
      type: object
      required: [model_id, dataset_id]
      properties:
        model_id:
          type: string
          format: uuid
        dataset_id:
          type: string
          format: uuid
        checkpoint_path:
          type: string
        output_format:
          type: string
          enum: [csv, json]
          default: csv

    InferenceTask:
      type: object
      properties:
        task_id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
        dataset_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, success, failed]
        progress:
          type: number
          minimum: 0
          maximum: 1
        result_path:
          type: string
        predictions:
          type: array
          items:
            type: object
            properties:
              input: {}
              prediction: {}
              confidence:
                type: number
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time

    OnlineInferenceRequest:
      type: object
      required: [model_id, input_data]
      properties:
        model_id:
          type: string
          format: uuid
        checkpoint_path:
          type: string
        input_data:
          oneOf:
            - type: object
              additionalProperties: true
              description: Tabular input (column → value)
            - type: string
              description: Base64-encoded image for CV models

    OnlineInferenceResult:
      type: object
      properties:
        prediction: {}
        confidence:
          type: number
        probabilities:
          type: object
          additionalProperties:
            type: number
        latency_ms:
          type: number

    ExportOnnxRequest:
      type: object
      required: [model_id]
      properties:
        model_id:
          type: string
          format: uuid
        checkpoint_path:
          type: string
        opset_version:
          type: integer
          default: 17
        dynamic_batch:
          type: boolean
          default: true

    # ─── Agent ─────────────────────────────────────────────
    AgentCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        system_prompt:
          type: string
        model_config:
          type: object
          properties:
            provider:
              type: string
              enum: [openai, anthropic, azure, mock]
              default: mock
            model:
              type: string
              default: gpt-4
            temperature:
              type: number
              default: 0.7
            max_tokens:
              type: integer
              default: 2048
        description:
          type: string

    AgentUpdate:
      type: object
      properties:
        name:
          type: string
        system_prompt:
          type: string
        model_config:
          type: object
          properties:
            provider:
              type: string
            model:
              type: string
            temperature:
              type: number
            max_tokens:
              type: integer
        status:
          type: string
          enum: [active, inactive]

    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        system_prompt:
          type: string
        model_config:
          type: object
          additionalProperties: true
        tools:
          type: array
          items:
            $ref: '#/components/schemas/AgentTool'
        status:
          type: string
          enum: [active, inactive]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentTool:
      type: object
      properties:
        tool_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [model_inference, api_call, custom]
        description:
          type: string
        config:
          type: object
          additionalProperties: true
          description: Tool configuration (endpoint, parameters schema, etc.)
        bound_at:
          type: string
          format: date-time

    ToolBindRequest:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name:
                type: string
              type:
                type: string
                enum: [model_inference, api_call, custom]
              model_id:
                type: string
                format: uuid
                description: Required when type = model_inference
              description:
                type: string
              config:
                type: object
                additionalProperties: true

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        conversation_id:
          type: string
          format: uuid
          description: Continue an existing conversation
        stream:
          type: boolean
          default: true

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
        tool_calls:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              arguments:
                type: object
                additionalProperties: true
              result: {}
        created_at:
          type: string
          format: date-time

    PaginatedChatHistory:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ChatMessage'

    PromptTemplateCreate:
      type: object
      required: [name, template]
      properties:
        name:
          type: string
        template:
          type: string
        description:
          type: string
        variables:
          type: array
          items:
            type: string
          description: Template variable names (e.g. ["context", "question"])

    PromptTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        name:
          type: string
        template:
          type: string
        description:
          type: string
        variables:
          type: array
          items:
            type: string
