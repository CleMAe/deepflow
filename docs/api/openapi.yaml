openapi: 3.0.3
info:
  title: DeepFlow API
  description: End-to-end deep learning platform API — Data Upload → Cleaning → Model Building → Training → Inference → Agent
  version: 1.0.0
  contact:
    name: DeepFlow Team

servers:
  - url: http://localhost:8000/api/v1
    description: Local development

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: Authentication & user management
  - name: Projects
    description: Project CRUD
  - name: Datasets
    description: Dataset upload & management
  - name: Cleaning
    description: Data cleaning, EDA, augmentation & splitting
  - name: ModelLibrary
    description: Pre-built model library
  - name: Models
    description: Project model configuration
  - name: Training
    description: Training job management & monitoring
  - name: Experiments
    description: Experiment tracking & comparison
  - name: Inference
    description: Model evaluation, batch & online inference
  - name: Agent
    description: Agent management, chat & tool binding

paths:
  # ─── Auth (P6) ────────────────────────────────────────────
  /auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Login with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      operationId: authRegister
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/refresh:
    post:
      operationId: authRefresh
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'

  /auth/me:
    get:
      operationId: authMe
      tags: [Auth]
      summary: Get current user info
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  # ─── Projects (P6) ────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated project list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedProjects'

    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      tags: [Projects]
      summary: Get project detail
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateProject
      tags: [Projects]
      summary: Update project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Delete project
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Datasets (P7) ────────────────────────────────────────
  /projects/{id}/datasets/upload/init:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: initDatasetUpload
      tags: [Datasets]
      summary: Initialize a chunked upload session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadInitRequest'
      responses:
        '200':
          description: Upload session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadSession'

  /projects/{id}/datasets/upload/{upload_id}/chunk:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: uploadChunk
      tags: [Datasets]
      summary: Upload a file chunk
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [chunk, chunk_index, total_chunks]
              properties:
                chunk:
                  type: string
                  format: binary
                chunk_index:
                  type: integer
                total_chunks:
                  type: integer
      responses:
        '200':
          description: Chunk received
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          received_chunks:
                            type: array
                            items:
                              type: integer

  /projects/{id}/datasets/upload/{upload_id}/complete:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: completeUpload
      tags: [Datasets]
      summary: Merge all chunks and finalize upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [total_chunks]
              properties:
                total_chunks:
                  type: integer
                dataset_name:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Upload completed, dataset created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Dataset'

  /projects/{id}/datasets/upload:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: uploadDatasetSimple
      tags: [Datasets]
      summary: Simple single-file upload (< 500MB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Dataset uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Dataset'

  /projects/{id}/datasets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listDatasets
      tags: [Datasets]
      summary: List datasets in project
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json, image, other]
        - name: status
          in: query
          schema:
            type: string
            enum: [uploading, ready, cleaning, cleaned, error]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated dataset list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedDatasets'

    post:
      operationId: createDataset
      tags: [Datasets]
      summary: Register dataset metadata (without file upload)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetCreate'
      responses:
        '201':
          description: Dataset created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Dataset'

  /projects/{id}/datasets/{ds_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    get:
      operationId: getDataset
      tags: [Datasets]
      summary: Get dataset detail
      responses:
        '200':
          description: Dataset detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Dataset'
    put:
      operationId: updateDataset
      tags: [Datasets]
      summary: Update dataset metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetUpdate'
      responses:
        '200':
          description: Dataset updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Dataset'
    delete:
      operationId: deleteDataset
      tags: [Datasets]
      summary: Delete dataset
      responses:
        '200':
          description: Dataset deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /projects/{id}/datasets/{ds_id}/preview:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    get:
      operationId: previewDataset
      tags: [Datasets]
      summary: Preview dataset (first 100 rows)
      parameters:
        - name: rows
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        '200':
          description: Dataset preview
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DatasetPreview'

  /projects/{id}/datasets/{ds_id}/images:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    get:
      operationId: listDatasetImages
      tags: [Datasets]
      summary: Image gallery with thumbnails and labels
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: label
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated image list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedImages'

  /projects/{id}/datasets/{ds_id}/labels:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    put:
      operationId: updateImageLabels
      tags: [Datasets]
      summary: Batch update image labels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchLabelUpdate'
      responses:
        '200':
          description: Labels updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          updated_count:
                            type: integer

  # ─── Cleaning (P7) ────────────────────────────────────────
  /projects/{id}/datasets/{ds_id}/clean/missing:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      operationId: cleanMissing
      tags: [Cleaning]
      summary: Handle missing values
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanMissingRequest'
      responses:
        '200':
          description: Missing values handled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CleaningResult'

  /projects/{id}/datasets/{ds_id}/clean/outlier:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      operationId: detectOutliers
      tags: [Cleaning]
      summary: Detect and handle outliers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanOutlierRequest'
      responses:
        '200':
          description: Outliers handled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CleaningResult'

  /projects/{id}/datasets/{ds_id}/clean/dedup:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      operationId: deduplicate
      tags: [Cleaning]
      summary: Remove duplicate rows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanDedupRequest'
      responses:
        '200':
          description: Duplicates removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CleaningResult'

  /projects/{id}/datasets/{ds_id}/clean/encode:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      operationId: encodeColumns
      tags: [Cleaning]
      summary: Encode categorical columns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanEncodeRequest'
      responses:
        '200':
          description: Encoding complete
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CleaningResult'

  /projects/{id}/datasets/{ds_id}/clean/type-convert:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      operationId: typeConvert
      tags: [Cleaning]
      summary: Convert column data types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanTypeConvertRequest'
      responses:
        '200':
          description: Type conversion complete
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CleaningResult'

  /projects/{id}/datasets/{ds_id}/eda:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      operationId: runEDA
      tags: [Cleaning]
      summary: Run one-click EDA analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EDARequest'
      responses:
        '200':
          description: EDA analysis started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EDAReport'

  /projects/{id}/datasets/{ds_id}/eda/report:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    get:
      operationId: getEDAReport
      tags: [Cleaning]
      summary: Get EDA report
      responses:
        '200':
          description: EDA report
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EDAReport'

  /projects/{id}/datasets/{ds_id}/augment:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      operationId: augmentDataset
      tags: [Cleaning]
      summary: Apply CV data augmentation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AugmentRequest'
      responses:
        '200':
          description: Augmentation complete
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AugmentResult'

  /projects/{id}/datasets/{ds_id}/split:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/DatasetId'
    post:
      operationId: splitDataset
      tags: [Cleaning]
      summary: Split dataset into train/val/test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SplitRequest'
      responses:
        '200':
          description: Dataset split complete
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SplitResult'

  # ─── Model Library (P8) ───────────────────────────────────
  /models/library:
    get:
      operationId: listModelLibrary
      tags: [ModelLibrary]
      summary: List pre-built models
      parameters:
        - name: task_type
          in: query
          schema:
            type: string
            enum: [classification, regression, object_detection, segmentation]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Model library list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/LibraryModel'

  /models/library/{model_id}:
    parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getModelLibraryDetail
      tags: [ModelLibrary]
      summary: Get pre-built model detail
      responses:
        '200':
          description: Model detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LibraryModel'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── Models (P8) ──────────────────────────────────────────
  /projects/{id}/models:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectModels
      tags: [Models]
      summary: List project model configurations
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated model list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaginatedModels'

    post:
      operationId: createProjectModel
      tags: [Models]
      summary: Create a model configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelCreate'
      responses:
        '201':
          description: Model configuration created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'

  /projects/{id}/models/{m_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: m_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProjectModel
      tags: [Models]
      summary: Get model configuration detail
      responses:
        '200':
          description: Model detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Model'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateProjectModel
      tags: [Models]
      summary: Update model configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpdate'
      responses:
        '200':
          description: Model updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Model'

  /projects/{id}/models/{m_id}/validate:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: m_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: validateModelConfig
      tags: [Models]
      summary: Validate model parameter configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelValidateRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ValidationResult'

  /projects/{id}/models/{m_id}/pretrained:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: m_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: loadPretrainedWeights
      tags: [Models]
      summary: Load pretrained weights for model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                  enum: [huggingface, modelscope, local]
                  default: huggingface
                repo_id:
                  type: string
                  description: Repository ID (e.g. "microsoft/resnet-18")
      responses:
        '200':
          description: Pretrained weights loading started
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            enum: [loading, ready, failed]
                          model_path:
                            type: string

