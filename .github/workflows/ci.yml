# DeepFlow CI — Day 2 (P9)
# Pipeline: lint → unit-test (FE Vitest) → integration-test (BE pytest) → build-docker

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend ESLint
        working-directory: frontend
        run: npm run lint

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Backend static checks
        run: |
          # 仅语法/未定义名等关键项，避免 Day 2 因存量风格问题阻断流水线
          ruff check src backend --select E9,F63,F7,F82
          python -m compileall -q src backend

  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend unit tests (Vitest)
        working-directory: frontend
        run: npm test

  integration-test:
    name: integration-test
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Backend integration tests (pytest + SQLite in-memory)
        working-directory: backend
        env:
          DATABASE_URL: sqlite://
          DEV_ALLOW_ANONYMOUS: "false"
          JWT_SECRET_KEY: ci-test-jwt-secret-key-32chars-minimum
          DEEPFLOW_TESTING: "1"
        run: pytest -m "not integration and not gpu"

  build-docker:
    name: build-docker
    runs-on: ubuntu-latest
    needs: integration-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare backend Docker build context
        run: cp requirements.txt backend/requirements.txt

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          load: true
          tags: deepflow-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          load: true
          tags: deepflow-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify images loaded
        run: docker image inspect deepflow-backend:ci deepflow-frontend:ci
