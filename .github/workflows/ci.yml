# DeepFlow CI — Day 2 (P9)
# Pipeline: lint → unit-test (FE, optional) + integration-test (BE) → build-docker
# Frontend steps run only when frontend/package.json exists; backend always runs.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "20"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Frontend (optional) ───────────────────────────────────
      - name: Set up Node.js
        if: hashFiles('frontend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Frontend ESLint
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: npm run lint

      - name: Skip frontend lint (no package.json)
        if: hashFiles('frontend/package.json') == ''
        run: echo "frontend/package.json not found — skipping FE lint"

      # ─── Backend (always) ──────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Backend static checks
        run: |
          ruff check src backend
          python -m compileall -q src backend

  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    needs: lint
    if: hashFiles('frontend/package.json') != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Frontend unit tests (Vitest)
        working-directory: frontend
        run: npm test

  integration-test:
    name: integration-test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Backend integration tests (pytest + SQLite in-memory)
        working-directory: backend
        env:
          DATABASE_URL: sqlite://
          DEV_ALLOW_ANONYMOUS: "false"
          JWT_SECRET_KEY: ci-test-jwt-secret-key-32chars-minimum
          DEEPFLOW_TESTING: "1"
        run: pytest -m "not integration and not gpu"

  build-docker:
    name: build-docker
    runs-on: ubuntu-latest
    needs: [lint, integration-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare backend Docker build context
        run: cp requirements.txt backend/requirements.txt

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          load: true
          tags: deepflow-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        if: hashFiles('frontend/package.json') != '' && hashFiles('docker/frontend/Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          load: true
          tags: deepflow-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify images loaded
        run: |
          docker image inspect deepflow-backend:ci
          if [ -f frontend/package.json ] && [ -f docker/frontend/Dockerfile ]; then
            docker image inspect deepflow-frontend:ci
          fi
