[pytest]
testpaths = tests
pythonpath = . .. ../src
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::DeprecationWarning:factory
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    integration: marks tests that hit external services (deselect with '-m "not integration"')
    e2e: end-to-end pipeline tests (deselect with '-m "not e2e"')
    gpu: marks tests that require CUDA (deselect with '-m "not gpu"')
