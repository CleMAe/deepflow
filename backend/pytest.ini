[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::DeprecationWarning:factory
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    integration: marks tests that hit external services (deselect with '-m "not integration"')
    gpu: marks tests that require CUDA (deselect with '-m "not gpu"')
